<!DOCTYPE html>
<html>
<head>
  <title>AI Receptionist Dashboard</title>
</head>
<body>

<h1>Dashboard Chiamate</h1>

<button onclick="loadCalls()">Carica Chiamate</button>

<ul id="calls"></ul>

<script>
async function loadCalls() {
  const res = await fetch('/calls');
  const data = await res.json();

  const list = document.getElementById('calls');
  list.innerHTML = "";

  data.forEach(call => {
    const li = document.createElement('li');
    li.textContent = `
      Tipo: ${call.type} | Da: ${call.from_number} | Ora: ${call.time}
    `;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
